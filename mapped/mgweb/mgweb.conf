timeout 30

<cgi>
    HTTP*
    AUTH_PASSWORD
    AUTH_TYPE
    CONTENT_TYPE
    REMOTE_ADDR
</cgi>

<server NodeJS>
   type Bun
   host 127.0.0.1
   tcp_port 7777
   connection_test off
</server>

<server ydbapi>
 type YottaDB
 path /usr/local/lib/yottadb/r206
 <env>
   ydb_gbldir=/opt/yottadb/yottadb.gld
   ydb_routines=/opt/agility/m /usr/local/lib/yottadb/r206/libyottadbutil.so
   ydb_ci=/usr/local/lib/yottadb/r206/zmgsi.ci
 </env>
</server>

<location /agility >
  function /opt/agility/mapped/mgweb/router.mjs
  servers NodeJS
</location >


